<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản lý phòng trọ</title>
<style>
:root{--bg:#fff;--card:#fff;--tx:#222;--mu:#777;--bd:#444;--fill:#eee;--pr:#222;--ok:#222;--wa:#222;--er:#222;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1a1a;--card:#1a1a1a;--tx:#ddd;--mu:#999;--bd:#aaa;--fill:#2c2c2c;--pr:#ddd}}
:root[data-theme="dark"]{--bg:#1a1a1a;--card:#1a1a1a;--tx:#ddd;--mu:#999;--bd:#aaa;--fill:#2c2c2c;--pr:#ddd}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Courier New",ui-monospace,monospace}
header{border-bottom:2px solid var(--bd);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{font-size:16px;margin:0;border:2px solid var(--bd);padding:2px 10px}
h2{font-size:16px}
nav{display:flex;gap:6px;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--tx)}
button{border:2px solid var(--bd);background:var(--card);padding:4px 10px;border-radius:0;cursor:pointer}
button:hover{background:var(--fill)}
button.on,button.pri{background:var(--tx);color:var(--bg);border-color:var(--tx)}
button.dg{border-style:dashed}
input,select{border:2px solid var(--bd);background:var(--card);padding:4px 8px;border-radius:0;min-width:0}
main{max-width:1100px;margin:0 auto;padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.bar .sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border:2px solid var(--bd);padding:14px}
.card h3{margin:0 0 4px;font-size:15px;border-bottom:1px dashed var(--bd);padding-bottom:4px}
.mu{color:var(--mu);font-size:12px}
.st{display:inline-block;padding:0 8px;border:1px solid var(--bd);font-size:12px}
.st::before{content:"["}.st::after{content:"]"}
.stats{display:flex;gap:14px;margin:8px 0;font-size:12px}.stats b{display:block;font-size:18px}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tw{overflow-x:auto;border:2px solid var(--bd)}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px dashed var(--bd);white-space:nowrap}
th{font-size:12px;background:var(--fill);border-bottom:2px solid var(--bd)}
tr:last-child td{border-bottom:0}
.tabs{display:flex;gap:0;overflow-x:auto;margin-bottom:-2px}
.tabs button{white-space:nowrap;border-bottom:0}
dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 16px;margin:0}
dt{font-size:12px;color:var(--mu)}dd{margin:0;font-weight:bold;border-bottom:1px dashed var(--bd)}
.ph{height:90px;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:12px;background:linear-gradient(to top right,transparent calc(50% - 1px),var(--bd),transparent calc(50% + 1px)),linear-gradient(to bottom right,transparent calc(50% - 1px),var(--bd),transparent calc(50% + 1px))}
.ph span{background:var(--bg);padding:0 6px}
.note{border:2px dashed var(--bd);padding:8px 12px;margin-bottom:12px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>[LOGO] Quản lý phòng trọ</h1>
  <nav id="nav"></nav>
  <div><label class="mu">Vai trò: <select id="role"><option value="admin">Admin</option><option value="guest">Khách / Người thuê</option></select></label></div>
</header>
<main id="app"></main>
<script>
const KHU=[
 {id:'K01',ten:'Khu A',dc:'12 Nguyễn Trãi, Xuân Lộc',mt:'Khu trọ gần chợ, an ninh 24/7',tt:'Hoạt động',ng:'01/03/2026'},
 {id:'K02',ten:'Khu B',dc:'45 Lê Lợi, Xuân Lộc',mt:'Dãy nhà mới xây, có sân xe',tt:'Hoạt động',ng:'15/05/2026'},
 {id:'K03',ten:'Khu C',dc:'8 Hùng Vương, Xuân Lộc',mt:'Đang cải tạo',tt:'Tạm ngưng',ng:'20/08/2026'}];
const P=[
 {ma:'P101',ten:'Phòng 101',khu:'K01',tang:1,dt:20,gia:2500000,coc:2500000,tt:'Đang thuê',nt:'Nguyễn Văn An',own:1},
 {ma:'P102',ten:'Phòng 102',khu:'K01',tang:1,dt:22,gia:2800000,coc:2800000,tt:'Trống',nt:'—'},
 {ma:'P201',ten:'Phòng 201',khu:'K01',tang:2,dt:25,gia:3200000,coc:3200000,tt:'Đã đặt cọc',nt:'—'},
 {ma:'P202',ten:'Phòng 202',khu:'K01',tang:2,dt:25,gia:3200000,coc:3200000,tt:'Đang thuê',nt:'Trần Thị Bình'},
 {ma:'B101',ten:'Phòng B101',khu:'K02',tang:1,dt:18,gia:2200000,coc:2200000,tt:'Trống',nt:'—'},
 {ma:'B102',ten:'Phòng B102',khu:'K02',tang:1,dt:18,gia:2200000,coc:2200000,tt:'Đang sửa chữa',nt:'—'},
 {ma:'C101',ten:'Phòng C101',khu:'K03',tang:1,dt:20,gia:2000000,coc:2000000,tt:'Ngừng kinh doanh',nt:'—'}];
const cls={'Trống':'ok','Đã đặt cọc':'pr','Đang thuê':'wa','Đang sửa chữa':'er','Ngừng kinh doanh':'er','Hoạt động':'ok','Tạm ngưng':'er'};
const TS=Object.keys(cls).slice(0,5);
const vnd=n=>n.toLocaleString('vi-VN')+' ₫';
const kn=id=>KHU.find(k=>k.id===id).ten;
const $=s=>document.querySelector(s);
let role='admin',page='khu',cur='P101',tab=0,f={q:'',khu:'',tt:'',a:'',b:''};
const st=t=>`<span class="st ${cls[t]||''}">${t}</span>`;
const adm=()=>role==='admin';

function nav(){
 const items=[['khu','Khu vực'],['phong','Danh sách phòng'],['ct','Chi tiết phòng']];
 $('#nav').innerHTML=items.map(([k,l])=>`<button class="${page===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
}
function go(p,m){page=p;if(m){cur=m;tab=0}render()}
function render(){nav();$('#app').innerHTML=page==='khu'?vKhu():page==='phong'?vPhong():vCT()}

function vKhu(){
 const cnt=k=>{const r=P.filter(p=>p.khu===k);return{t:r.length,tr:r.filter(p=>p.tt==='Trống').length,th:r.filter(p=>p.tt==='Đang thuê').length}};
 const my=P.find(p=>p.own);
 const list=KHU.filter(k=>(!f.q||(k.ten+k.id).toLowerCase().includes(f.q.toLowerCase()))&&(!f.tt||k.tt===f.tt)).filter(k=>adm()||k.tt==='Hoạt động');
 return `<div class="bar"><h2 style="margin:0">Quản lý khu vực</h2><span class="sp"></span>
 <input placeholder="Tìm khu..." value="${f.q}" oninput="f.q=this.value;render2()">
 ${adm()?`<select onchange="f.tt=this.value;render()"><option value="">Mọi trạng thái</option><option ${f.tt==='Hoạt động'?'selected':''}>Hoạt động</option><option ${f.tt==='Tạm ngưng'?'selected':''}>Tạm ngưng</option></select><button class="pri" onclick="alert('Form thêm khu')">+ Thêm khu</button>`:''}</div>
 <div class="grid">${list.map(k=>{const c=cnt(k.id);return `<div class="card"><h3>${k.ten} <span class="mu">· ${k.id}</span></h3>${st(k.tt)}
 <p class="mu" style="margin:8px 0 0">${k.dc}<br>${k.mt}</p>
 ${adm()?`<div class="stats"><div><b>${c.t}</b>Tổng phòng</div><div><b>${c.tr}</b>Trống</div><div><b>${c.th}</b>Đang thuê</div></div><div class="mu">Tạo/cập nhật: ${k.ng}</div>
 <div class="acts"><button onclick="go('phong');f.khu='${k.id}';render()">Xem chi tiết</button><button onclick="alert('Sửa ${k.ten}')">Sửa</button><button class="dg" onclick="confirm('Xóa ${k.ten}?')">Xóa</button></div>`
 :`<div class="stats"><div><b>${c.t}</b>Tổng phòng</div></div><div class="acts"><button onclick="go('phong');f.khu='${k.id}';render()">Xem thông tin khu</button>${my&&my.khu===k.id?`<button class="pri" onclick="go('ct','${my.ma}')">Xem phòng của tôi</button>`:''}</div>`}</div>`}).join('')}</div>`;
}
function render2(){const v=document.activeElement,p=v.selectionStart;render();const i=$('#app input');if(i){i.focus();i.setSelectionRange(p,p)}}

function vPhong(){
 let r=P.filter(p=>(!f.q||(p.ma+p.ten).toLowerCase().includes(f.q.toLowerCase()))&&(!f.khu||p.khu===f.khu)&&(!f.tt||p.tt===f.tt)&&(!f.a||p.gia>=+f.a)&&(!f.b||p.gia<=+f.b));
 if(!adm())r=r.filter(p=>p.own||p.tt==='Trống');
 return `<div class="bar"><h2 style="margin:0">Danh sách phòng</h2><span class="sp"></span>${adm()?'<button class="pri" onclick="alert(\'Form thêm phòng\')">+ Thêm phòng</button>':''}</div>
 <div class="bar"><input placeholder="Mã/tên phòng" value="${f.q}" oninput="f.q=this.value;render2()">
 <select onchange="f.khu=this.value;render()"><option value="">Mọi khu</option>${KHU.map(k=>`<option value="${k.id}" ${f.khu===k.id?'selected':''}>${k.ten}</option>`).join('')}</select>
 <select onchange="f.tt=this.value;render()"><option value="">Mọi trạng thái</option>${TS.map(t=>`<option ${f.tt===t?'selected':''}>${t}</option>`).join('')}</select>
 <input type="number" placeholder="Giá từ" style="width:110px" value="${f.a}" onchange="f.a=this.value;render()">
 <input type="number" placeholder="Giá đến" style="width:110px" value="${f.b}" onchange="f.b=this.value;render()"></div>
 <div class="tw"><table><tr><th>Mã</th><th>Tên</th><th>Khu</th><th>Tầng</th><th>m²</th><th>Giá</th>${adm()?'<th>Cọc</th>':''}<th>Trạng thái</th>${adm()?'<th>Người thuê</th>':''}<th></th></tr>
 ${r.map(p=>`<tr><td>${p.ma}</td><td>${p.ten}</td><td>${kn(p.khu)}</td><td>${p.tang}</td><td>${p.dt}</td><td>${vnd(p.gia)}</td>${adm()?`<td>${vnd(p.coc)}</td>`:''}<td>${st(p.tt)}</td>${adm()?`<td>${p.nt}</td>`:''}
 <td>${adm()?`<button onclick="go('ct','${p.ma}')">Xem</button> <button onclick="alert('Sửa')">Sửa</button> <button class="dg" onclick="confirm('Xóa ${p.ma}?')">Xóa</button>`:`<button onclick="${p.own?`go('ct','${p.ma}')`:`alert('Chỉ xem thông tin cơ bản')`}">Xem</button>`}</td></tr>`).join('')||'<tr><td colspan="10" class="mu">Không có phòng phù hợp</td></tr>'}</table></div>`;
}

function vCT(){
 const p=P.find(x=>x.ma===cur);
 if(!adm()&&!p.own)return `<div class="card">Bạn chỉ được xem phòng mình đang thuê. <button onclick="go('ct','P101')">Về phòng của tôi</button></div>`;
 const T=adm()?['Thông tin','Người thuê','Hợp đồng','Điện nước & DV','Cơ sở vật chất','Bàn giao']:['Thông tin','Hợp đồng','Điện nước & DV','Cơ sở vật chất','Bàn giao'];
 if(tab>=T.length)tab=0;
 const d=(a)=>`<dl>${a.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
 const tb=(h,rows)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
 const sel=(adm()?['Thông tin','Người thuê','Hợp đồng','Điện nước & DV','Cơ sở vật chất','Bàn giao']:T)[tab];
 let body='';
 if(sel==='Thông tin')body=d([['Mã phòng',p.ma],['Tên phòng',p.ten],['Khu',kn(p.khu)],['Tầng',p.tang],['Diện tích',p.dt+' m²'],['Giá phòng',vnd(p.gia)],...(adm()?[['Tiền cọc',vnd(p.coc)]]:[]),['Trạng thái',st(p.tt)],...(adm()?[['Ngày tạo','01/03/2026'],['Cập nhật','20/09/2026'],['Ghi chú','Phòng hướng Đông']]:[])])+`<div class="ph" style="margin-top:12px"><span>Hình ảnh phòng</span></div>`;
 if(sel==='Người thuê')body=d([['Họ tên',p.nt],['SĐT','0901 234 567'],['CCCD','075xxxxxxxxx'],['Bắt đầu','01/01/2026'],['Kết thúc','31/12/2026'],['Số người ở',2],['Trạng thái',st('Đang thuê')]])+`<div class="acts"><button class="pri" onclick="alert('Thêm')">Thêm người thuê</button><button>Sửa thông tin</button><button>Xem hồ sơ</button><button class="dg">Xóa người thuê</button></div>`;
 if(sel==='Hợp đồng')body=d([['Mã hợp đồng','HD-2026-001'],...(adm()?[['Người thuê',p.nt]]:[]),['Ngày bắt đầu','01/01/2026'],['Ngày kết thúc','31/12/2026'],['Giá thuê',vnd(p.gia)],['Tiền cọc',vnd(p.coc)],['Trạng thái',st('Đang thuê')]])+`<div class="acts"><button>Xem hợp đồng</button><button>Tải hợp đồng</button>${adm()?'<button class="pri">Gia hạn hợp đồng</button>':''}</div>`;
 if(sel==='Điện nước & DV')body=tb(['Hạng mục','Đầu kỳ','Cuối kỳ','Đơn giá','Thành tiền'],[['Điện','1200','1285','3.500','297.500 ₫'],['Nước','45','52','15.000','105.000 ₫'],['Wifi','—','—','—','100.000 ₫'],['Rác','—','—','—','30.000 ₫'],['Dịch vụ khác','—','—','—','0 ₫'],['<b>Tổng kỳ này</b>','','','','<b>532.500 ₫</b>']])+`<p class="mu">Ngày ghi chỉ số: 30/09/2026</p><div class="acts">${adm()?'<button class="pri">Cập nhật chỉ số</button>':''}<button>Lịch sử điện/nước</button><button>Lịch sử thanh toán</button></div>`;
 if(sel==='Cơ sở vật chất')body=tb(['Thiết bị','SL','Tình trạng','Ghi chú','Ảnh'],[['Máy lạnh',1,'Tốt','',''],['Tủ lạnh',1,'Tốt','',''],['Giường',1,'Tốt','',''],['Tủ quần áo',1,'Trầy nhẹ','',''],['Bàn ghế',2,'Tốt','',''],['Bình nóng lạnh',1,'Tốt','',''],['Thiết bị vệ sinh',1,'Tốt','','']].map(r=>{r[4]='[img]';return r}))+`<div class="acts">${adm()?'<button class="pri">Thêm thiết bị</button><button>Chỉnh sửa</button><button class="dg">Xóa</button><button>Thêm hình ảnh</button>':'<button>Báo hỏng thiết bị</button><button>Báo sự cố</button>'}</div>`;
 if(sel==='Bàn giao')body=d([['Ngày bàn giao','01/01/2026'],...(adm()?[['Người bàn giao','Chủ trọ'],['Người nhận',p.nt]]:[]),['Tình trạng phòng','Sạch, nguyên vẹn'],['Tình trạng thiết bị','Đầy đủ, hoạt động tốt'],['Ghi chú','Tủ quần áo trầy nhẹ']])+`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:12px"><div class="ph"><span>Ảnh lúc nhận phòng</span></div>${adm()?'<div class="ph"><span>Ảnh sau khi trả phòng</span></div>':''}</div><div class="acts"><button>Xem biên bản</button>${adm()?'<button class="pri">Cập nhật tình trạng</button><button>Thêm hình ảnh</button>':''}</div>`;
 return `<div class="bar"><h2 style="margin:0">${p.ten} · ${kn(p.khu)}</h2>${st(p.tt)}<span class="sp"></span>${adm()?`<select onchange="go('ct',this.value)">${P.map(x=>`<option value="${x.ma}" ${x.ma===cur?'selected':''}>${x.ma}</option>`).join('')}</select>`:''}</div>
 ${adm()?'':'<div class="note">Bạn đang xem phòng của mình — chỉ đọc.</div>'}
 <div class="tabs">${T.map((t,i)=>`<button class="${i===tab?'on':''}" onclick="tab=${i};render()">${t}</button>`).join('')}</div><div class="card">${body}</div>`;
}
$('#role').onchange=e=>{role=e.target.value;if(page==='ct'&&role==='guest')cur='P101';f={q:'',khu:'',tt:'',a:'',b:''};render()};
render();
</script>
</body>
</html>
