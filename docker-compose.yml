services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: goctro
      POSTGRES_USER: goctro
      POSTGRES_PASSWORD: goctro_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goctro -d goctro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
